name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: macos-15-arm64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Xcode developer dir not found: $DEVELOPER_DIR" >&2
            exit 1
          fi
          xcodebuild -version
          swift --version
      - name: Build
        run: make build
      - name: Test
        run: make test TEST_FLAGS=
      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in Scripts/*.sh; do
            bash -n "$f"
          done

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: macos-15-arm64
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Xcode developer dir not found: $DEVELOPER_DIR" >&2
            exit 1
          fi
          xcodebuild -version
          swift --version
      # Builds both slices on this arm64 runner and ends with Scripts/verify_release.sh against
      # the tag-derived version, so the bundle version must equal the tag.
      - name: Build release
        shell: bash
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: Test release checks
        shell: bash
        run: Scripts/test_release.sh "dist/ClaudeBar-${GITHUB_REF_NAME#v}.zip"
      - name: Check release assets
        shell: bash
        run: |
          set -euo pipefail
          zip="ClaudeBar-${GITHUB_REF_NAME#v}.zip"
          actual="$(cd dist && find . -mindepth 1 -maxdepth 1 -print | sed 's|^\./||' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$zip" "$zip.sha256" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "expected only $zip and $zip.sha256 in dist/, found:" >&2
            echo "$actual" >&2
            exit 1
          fi
      - name: Create GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip="dist/ClaudeBar-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            --verify-tag \
            --generate-notes
